<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>N4 Flashcards — Bài 31–35</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#17181c;--muted:#6f7480;--line:#e7e9ef;--accent:#5b61f6;--good:#1f9d62;--bad:#d94b4b;--shadow:0 14px 40px rgba(20,24,40,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fafbff 0%,var(--bg) 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text)}.app{max-width:760px;margin:0 auto;padding:18px 16px 28px}.header{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}select,button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.good{background:#effaf5;color:var(--good);border-color:#cfeede}button.bad{background:#fff3f3;color:var(--bad);border-color:#f2cccc}.progress-wrap{margin:8px 0 14px}.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}.progress{height:8px;background:#e9ebf3;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:.25s}.card-wrap{perspective:1200px}.card{position:relative;min-height:390px;width:100%;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow);backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.back{transform:rotateY(180deg)}.badge{position:absolute;top:18px;left:18px;font-size:12px;padding:6px 9px;border-radius:999px;background:#f1f2f8;color:#676c79}.jp{font-size:34px;line-height:1.35;font-weight:750;letter-spacing:.01em}.reading{font-size:20px;color:var(--muted);margin-top:10px}.meaning{font-size:30px;font-weight:750}.note{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.55;max-width:520px}.tap{position:absolute;bottom:18px;font-size:12px;color:#9a9eaa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.small{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}@media(max-width:560px){.app{padding:14px 12px 22px}.card{min-height:365px}.face{padding:24px 18px}.jp{font-size:30px}.meaning{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<div class="header"><div><h1>N4 Flashcards — Bài 31–35</h1><div class="sub">50 từ • chạm thẻ để lật • tự lưu tiến độ trên máy</div></div><button id="resetBtn">Reset</button></div>
<div class="controls"><select id="lesson"><option value="all">Tất cả bài 31–35</option><option value="31">Bài 31</option><option value="32">Bài 32</option><option value="33">Bài 33</option><option value="34">Bài 34</option><option value="35">Bài 35</option></select><button id="shuffleBtn">🔀 Trộn thẻ</button><button id="reverseBtn">⇄ Nhật ⇄ Việt</button></div>
<div class="progress-wrap"><div class="progress-meta"><span id="counter">1 / 50</span><span id="modeLabel">Nhật → Việt</span></div><div class="progress"><div id="bar"></div></div></div>
<div class="card-wrap"><div class="card" id="card"><div class="face front"><div class="badge" id="badgeF">Bài 31</div><div id="frontMain" class="jp"></div><div id="frontSub" class="reading"></div><div class="tap">Chạm để xem đáp án</div></div><div class="face back"><div class="badge" id="badgeB">Bài 31</div><div id="backMain" class="meaning"></div><div id="backSub" class="note"></div><div class="tap">Chạm để quay lại</div></div></div></div>
<div class="actions"><button class="bad" id="againBtn">↻ Chưa nhớ</button><button class="good" id="knownBtn">✓ Đã nhớ</button></div>
<div class="nav"><button id="prevBtn">← Trước</button><button class="primary" id="flipBtn">Lật thẻ</button><button id="nextBtn">Sau →</button></div>
<div class="stats"><div class="stat"><b id="seen">0</b><span>Đã học</span></div><div class="stat"><b id="known">0</b><span>Đã nhớ</span></div><div class="stat"><b id="left">50</b><span>Còn lại</span></div></div>
<div class="small">Phím tắt: Space = lật • ←/→ = chuyển • 1 = chưa nhớ • 2 = đã nhớ</div>
</div>
<script>
const cards=[
{l:31,j:"チーム",r:"チーム",v:"đội, nhóm"},{l:31,j:"インフルエンザ",r:"インフルエンザ",v:"cúm"},{l:31,j:"うるさい",r:"うるさい",v:"ồn ào"},{l:31,j:"失敗します",r:"しっぱいします",v:"thất bại, trượt"},{l:31,j:"晴れます",r:"はれます",v:"trời quang, trời nắng"},{l:31,j:"冷やします",r:"ひやします",v:"làm mát, làm lạnh"},{l:31,j:"空きます",r:"すきます",v:"trống, vắng; có chỗ trống"},{l:31,j:"夕方",r:"ゆうがた",v:"chiều tối"},{l:31,j:"無理をします",r:"むりをします",v:"làm quá sức, gắng quá sức"},{l:31,j:"やみます",r:"やみます",v:"tạnh, ngừng (mưa/tuyết)"},
{l:32,j:"あきらめます",r:"あきらめます",v:"từ bỏ, bỏ cuộc"},{l:32,j:"だめ",r:"だめ",v:"không được; không tốt"},{l:32,j:"規則",r:"きそく",v:"quy tắc, quy định"},{l:32,j:"マーク",r:"マーク",v:"ký hiệu, dấu"},{l:32,j:"無料",r:"むりょう",v:"miễn phí"},{l:32,j:"危険",r:"きけん",v:"nguy hiểm"},{l:32,j:"徐行",r:"じょこう",v:"đi chậm, giảm tốc"},{l:32,j:"飲み放題",r:"のみほうだい",v:"buffet đồ uống; uống không giới hạn"},{l:32,j:"割引",r:"わりびき",v:"giảm giá"},{l:32,j:"伝えます",r:"つたえます",v:"truyền đạt, nhắn lại"},
{l:33,j:"磨きます",r:"みがきます",v:"đánh, chải (răng); đánh bóng"},{l:33,j:"さします",r:"さします",v:"che/cầm ô; giương ô"},{l:33,j:"矢印",r:"やじるし",v:"mũi tên"},{l:33,j:"ゆうべ",r:"ゆうべ",v:"tối qua"},{l:33,j:"苦い",r:"にがい",v:"đắng"},{l:33,j:"しょうゆ",r:"しょうゆ",v:"xì dầu, nước tương"},{l:33,j:"つけます",r:"つけます",v:"chấm; gắn; bật (tùy ngữ cảnh)"},{l:33,j:"スポーツクラブ",r:"スポーツクラブ",v:"câu lạc bộ thể thao"},{l:33,j:"見つかります",r:"みつかります",v:"được tìm thấy, tìm ra"},{l:33,j:"組み立てます",r:"くみたてます",v:"lắp ráp"},
{l:34,j:"入力します",r:"にゅうりょくします",v:"nhập vào, nhập dữ liệu"},{l:34,j:"困ります",r:"こまります",v:"gặp khó khăn, bối rối"},{l:34,j:"直ります",r:"なおります",v:"khỏi bệnh; được sửa, trở lại bình thường"},{l:34,j:"屋上",r:"おくじょう",v:"sân thượng, mái bằng"},{l:34,j:"ひも",r:"ひも",v:"dây, sợi dây"},{l:34,j:"もっと",r:"もっと",v:"hơn nữa, thêm nữa"},{l:34,j:"島",r:"しま",v:"đảo"},{l:34,j:"設備",r:"せつび",v:"thiết bị, cơ sở vật chất"},{l:34,j:"正しい",r:"ただしい",v:"đúng, chính xác"},{l:34,j:"変わります",r:"かわります",v:"thay đổi"},
{l:35,j:"貯金します",r:"ちょきんします",v:"tiết kiệm tiền"},{l:35,j:"宇宙",r:"うちゅう",v:"vũ trụ"},{l:35,j:"慣れます",r:"なれます",v:"quen với"},{l:35,j:"剣道",r:"けんどう",v:"kiếm đạo"},{l:35,j:"やっと",r:"やっと",v:"cuối cùng thì, mãi mới"},{l:35,j:"腐ります",r:"くさります",v:"bị hỏng, bị thiu, bị mục"},{l:35,j:"ほとんど",r:"ほとんど",v:"hầu hết; hầu như"},{l:35,j:"できるだけ",r:"できるだけ",v:"trong khả năng có thể; càng... càng tốt"},{l:35,j:"かなり",r:"かなり",v:"khá là, tương đối, đáng kể"},{l:35,j:"遭います",r:"あいます",v:"gặp/phải chịu (tai nạn, chuyện xấu)"}
];
let filtered=[...cards],idx=0,reverse=false;const state=JSON.parse(localStorage.getItem("n4fc-state")||'{"known":[],"seen":[]}');const el=id=>document.getElementById(id);function key(c){return c.l+"|"+c.j}function save(){localStorage.setItem("n4fc-state",JSON.stringify(state))}function setSeen(c){const k=key(c);if(!state.seen.includes(k)){state.seen.push(k);save()}}function updateStats(){const currentKeys=new Set(filtered.map(key));const seenN=state.seen.filter(k=>currentKeys.has(k)).length;const knownN=state.known.filter(k=>currentKeys.has(k)).length;el("seen").textContent=seenN;el("known").textContent=knownN;el("left").textContent=Math.max(filtered.length-knownN,0)}function render(){if(!filtered.length)return;const c=filtered[idx];el("card").classList.remove("flipped");el("badgeF").textContent=el("badgeB").textContent="Bài "+c.l;if(!reverse){el("frontMain").textContent=c.j;el("frontSub").textContent=c.r!==c.j?"（"+c.r+"）":"";el("backMain").textContent=c.v;el("backSub").textContent=c.j+(c.r!==c.j?"（"+c.r+"）":"")}else{el("frontMain").textContent=c.v;el("frontSub").textContent="";el("backMain").textContent=c.j;el("backSub").textContent=c.r!==c.j?"Cách đọc: "+c.r:""}el("counter").textContent=idx+1+" / "+filtered.length;el("modeLabel").textContent=reverse?"Việt → Nhật":"Nhật → Việt";el("bar").style.width=(idx+1)/filtered.length*100+"%";setSeen(c);updateStats()}function next(){idx=(idx+1)%filtered.length;render()}function prev(){idx=(idx-1+filtered.length)%filtered.length;render()}function flip(){el("card").classList.toggle("flipped")}function shuffle(){for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]]}idx=0;render()}function markKnown(){const k=key(filtered[idx]);if(!state.known.includes(k))state.known.push(k);save();updateStats();next()}function markAgain(){const k=key(filtered[idx]);state.known=state.known.filter(x=>x!==k);save();updateStats();next()}el("card").onclick=flip;el("flipBtn").onclick=flip;el("nextBtn").onclick=next;el("prevBtn").onclick=prev;el("shuffleBtn").onclick=shuffle;el("knownBtn").onclick=markKnown;el("againBtn").onclick=markAgain;el("reverseBtn").onclick=()=>{reverse=!reverse;render()};el("lesson").onchange=e=>{const v=e.target.value;filtered=v==="all"?[...cards]:cards.filter(c=>String(c.l)===v);idx=0;render()};el("resetBtn").onclick=()=>{if(confirm("Xóa toàn bộ tiến độ đã học?")){state.known=[];state.seen=[];save();render()}};document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();flip()}else if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();else if(e.key==="1")markAgain();else if(e.key==="2")markKnown()});render();
</script>
</body>
</html>
